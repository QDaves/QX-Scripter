name: Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build:
    name: Build ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, arch: x64, runtime: win-x64 }
          - { os: ubuntu-latest, arch: x64, runtime: linux-x64 }
          - { os: macos-latest, arch: x64, runtime: osx-x64 }
          - { os: macos-latest, arch: arm64, runtime: osx-arm64 }
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore solution
        run: dotnet restore QX.slnx --locked-mode --disable-build-servers

      - name: Verify generated message facade
        shell: pwsh
        run: ./tools/generate-message-facade.ps1 -check

      - name: Package Desktop
        shell: pwsh
        run: ./tools/publish.ps1 -runtime '${{ matrix.runtime }}' -edition Desktop

      - name: Package CLI
        shell: pwsh
        run: ./tools/publish.ps1 -runtime '${{ matrix.runtime }}' -edition CLI

      - name: Upload packages
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: QX-Scripter-${{ matrix.runtime }}
          path: |
            artifacts/*.zip
            artifacts/*.tar.gz
          if-no-files-found: error
          retention-days: 14
